<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Casos Clínicos</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#F7F6F2;
  --surface:#FFFFFF;
  --border:#E4E2DA;
  --border-soft:#EEECE6;
  --text:#1A1916;
  --text-2:#6B6860;
  --text-3:#A8A59E;
  --accent:#1A1916;
  --radius:10px;
  --radius-sm:6px;
  --shadow:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
  --shadow-md:0 4px 16px rgba(0,0,0,.08),0 1px 4px rgba(0,0,0,.04);

  --c-remember-bg:#F1EFE8; --c-remember-tx:#4A4840; --c-remember-ac:#888780;
  --c-producao-bg:#E8F0FA; --c-producao-tx:#0C447C; --c-producao-ac:#185FA5;
  --c-peer-bg:#FAF0E0;     --c-peer-tx:#633806;     --c-peer-ac:#BA7517;
  --c-revisado-bg:#EBF5E0; --c-revisado-tx:#27500A; --c-revisado-ac:#3B6D11;
  --c-publicado-bg:#EEEDFE;--c-publicado-tx:#3C3489;--c-publicado-ac:#533AB7;

  --c-remember-hd:#3A3830;
  --c-producao-hd:#0A3A6A;
  --c-peer-hd:#7A4A08;
  --c-revisado-hd:#1E4008;
  --c-publicado-hd:#2E2670;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:14px}

/* LOGIN SCREEN */
.login-screen{position:fixed;inset:0;background:var(--bg);z-index:500;display:flex;align-items:center;justify-content:center;padding:24px}
.login-screen.hidden{display:none}
.login-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-md);padding:40px 48px;width:100%;max-width:400px;text-align:center}
.login-logo{font-size:22px;font-weight:600;letter-spacing:-.03em;margin-bottom:6px}
.login-logo span{color:var(--text-2);font-weight:400}
.login-sub{font-size:13px;color:var(--text-3);margin-bottom:32px;line-height:1.55}
.btn-google{display:inline-flex;align-items:center;gap:10px;padding:11px 24px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);font-size:14px;font-weight:500;color:var(--text);cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .15s;box-shadow:var(--shadow);width:100%;justify-content:center}
.btn-google:hover{border-color:var(--text-3);box-shadow:var(--shadow-md)}
.btn-google:disabled{opacity:.5;cursor:not-allowed}
.btn-google svg{flex-shrink:0}
.login-error{margin-top:14px;font-size:12px;color:#c0392b;display:none}
.login-error.show{display:block}

/* NAV */
nav{background:var(--surface);border-bottom:1px solid var(--border);padding:0 24px;display:flex;align-items:center;gap:0;height:52px;position:sticky;top:0;z-index:40}
.nav-brand{font-weight:600;font-size:15px;margin-right:28px;letter-spacing:-.02em}
.nav-brand span{color:var(--text);font-weight:600}
.tab-btn{height:52px;padding:0 16px;background:none;border:none;border-bottom:2px solid transparent;cursor:pointer;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;color:var(--text-2);margin-bottom:-1px;transition:color .15s,border-color .15s}
.tab-btn:hover{color:var(--text)}
.tab-btn.active{color:var(--text);border-bottom-color:var(--text)}
.nav-right{margin-left:auto;display:flex;align-items:center;gap:14px}
.nav-status{font-size:12px;color:var(--text-3);display:flex;align-items:center;gap:6px}
.status-dot{width:7px;height:7px;border-radius:50%;background:#ccc;transition:background .3s}
.status-dot.ok{background:#4CAF50}
.status-dot.err{background:#e53e3e}
.nav-user{display:flex;align-items:center;gap:8px}
.nav-user-photo{width:28px;height:28px;border-radius:50%;object-fit:cover;border:1px solid var(--border)}
.nav-user-name{font-size:12px;font-weight:500;color:var(--text-2)}
.nav-signout{background:none;border:none;cursor:pointer;font-size:12px;color:var(--text-3);font-family:'DM Sans',sans-serif;padding:0;transition:color .12s}
.nav-signout:hover{color:var(--text)}
.btn-nav-new{padding:6px 14px;background:var(--text);color:#fff;border:none;border-radius:var(--radius-sm);font-size:12px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;transition:opacity .12s;white-space:nowrap}
.btn-nav-new:hover{opacity:.85}

/* PANES */
.pane{display:none}
.pane.active{display:block}

/* QUICK BAR */
.quick-bar{background:var(--surface);border-bottom:1px solid var(--border);padding:16px 24px;display:flex;gap:0;align-items:flex-start}
.qb-section{flex:1;min-width:0}
.qb-section-head{display:flex;align-items:center;gap:6px;margin-bottom:10px;font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--text-3)}
.qb-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.qb-dot-available{background:var(--c-remember-hd)}
.qb-dot-inprod{background:var(--c-producao-hd)}
.qb-count{background:var(--border);border-radius:99px;padding:1px 7px;font-size:10px;color:var(--text-2)}
.qb-scroll{display:flex;gap:6px;flex-wrap:wrap}
.qb-chip{background:var(--c-remember-bg);border:1px solid rgba(58,56,48,.15);border-radius:var(--radius-sm);padding:5px 10px;cursor:pointer;font-family:'DM Sans',sans-serif;font-size:12px;font-weight:500;color:var(--c-remember-tx);transition:all .12s;max-width:200px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qb-chip:hover{border-color:var(--c-remember-hd);filter:brightness(.96)}
.qb-inprod-card{display:flex;align-items:center;gap:7px;background:var(--c-producao-bg);border:1px solid rgba(10,58,106,.12);border-radius:var(--radius-sm);padding:6px 10px;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .12s;max-width:210px}
.qb-inprod-card:hover{border-color:var(--c-producao-hd);filter:brightness(.97)}
.qb-inprod-info{display:flex;flex-direction:column;gap:1px;min-width:0}
.qb-inprod-prof{font-size:10px;font-weight:600;color:var(--c-producao-tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qb-inprod-tema{font-size:11px;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qb-divider{width:1px;background:var(--border);margin:0 20px;flex-shrink:0;align-self:stretch;min-height:40px}
.qb-empty{font-size:11px;color:var(--text-3);font-style:italic;padding:5px 2px}

/* BOARD */
.board-wrap{overflow-x:auto;padding:20px 24px 8px}
.board{display:flex;gap:12px;align-items:flex-start;padding-bottom:4px;width:100%}
.column{flex:1 1 0;min-width:160px;display:flex;flex-direction:column;gap:6px}
.col-header{padding:11px 14px;border-radius:var(--radius-sm);font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;display:flex;align-items:center;justify-content:space-between;color:#fff}
.col-count{font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;background:rgba(255,255,255,.22);color:#fff}
.col-body{border:1px solid var(--border);border-radius:var(--radius);padding:8px;min-height:calc(100vh - 200px);transition:background .12s,border-color .12s}
.col-body.drag-over{background:rgba(0,0,0,.03);border-color:var(--text-3);border-style:dashed}

/* CARDS */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 11px;cursor:pointer;margin-bottom:6px;box-shadow:var(--shadow);transition:border-color .12s,box-shadow .12s}
.card:last-of-type{margin-bottom:0}
.card:hover{border-color:var(--text-3);box-shadow:var(--shadow-md)}
.card[draggable]:active{cursor:grabbing}
.card.dragging{opacity:.3;transform:rotate(1deg)}
.card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:6px;margin-bottom:2px}
.card-title{font-size:13px;font-weight:600;color:var(--text);line-height:1.35;flex:1;word-break:break-word}
.card-id-mono{font-family:'DM Mono',monospace;font-size:10px;color:var(--text-3);margin-bottom:5px}
.card-id{font-family:'DM Mono',monospace;font-size:11.5px;font-weight:500;color:var(--text);line-height:1.3;flex:1;word-break:break-all}
.card-actions{display:flex;align-items:center;gap:4px;flex-shrink:0}
.card-edit{background:none;border:none;cursor:pointer;color:var(--text-3);padding:0;line-height:1;transition:color .12s}
.card-edit:hover{color:var(--text)}
.card-pill{display:inline-block;font-size:10px;font-weight:500;padding:2px 7px;border-radius:99px;margin-bottom:4px}
.card-sub{font-size:11px;color:var(--text-2);margin-bottom:2px}
.card-footer{display:flex;align-items:center;justify-content:space-between;margin-top:8px;gap:6px;flex-wrap:wrap;min-height:22px}
.card-tipo{display:inline-block;font-size:10px;font-weight:600;padding:2px 7px;border-radius:99px}
.tipo-oral-online{background:#E8F0FA;color:#0C447C}
.tipo-criar{background:#EBF5E0;color:#27500A}
.tipo-simulação,.tipo-simulacao{background:#FAF0E0;color:#633806}
.card-claim-hint{font-size:10px;color:var(--c-producao-ac);font-weight:500;opacity:.85}
.prof-avatar{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;font-size:9px;font-weight:700;color:#fff;flex-shrink:0;font-family:'DM Mono',monospace;letter-spacing:-.5px}
.prof-avatar-sm{width:26px;height:26px;font-size:10px}

.add-btn{width:100%;padding:8px;border-radius:var(--radius-sm);border:1px dashed var(--border);background:transparent;color:var(--text-3);font-size:12px;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .12s;margin-top:6px}
.add-btn:hover{border-color:var(--text-3);color:var(--text-2);background:rgba(0,0,0,.02)}

/* MODAL (edit) */
.overlay{display:none;position:fixed;inset:0;background:rgba(20,18,14,.45);z-index:100;align-items:flex-start;justify-content:center;padding:24px 16px;overflow-y:auto}
.overlay.open{display:flex}
.modal{background:var(--surface);border-radius:var(--radius);border:1px solid var(--border);box-shadow:var(--shadow-md);padding:24px;width:100%;max-width:580px;margin:auto}
.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.modal-head h3{font-size:15px;font-weight:600;letter-spacing:-.02em}
.modal-close{background:none;border:none;cursor:pointer;color:var(--text-3);font-size:20px;line-height:1;padding:2px;transition:color .12s}
.modal-close:hover{color:var(--text)}
.field{margin-bottom:14px}
.field label{display:block;font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--text-2);margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg);color:var(--text);font-size:13px;font-family:'DM Sans',sans-serif;outline:none;transition:border-color .12s}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--text-3)}
.field textarea{resize:vertical;min-height:84px;line-height:1.55}
.divider{height:1px;background:var(--border-soft);margin:16px 0}
.img-zone{border:1px dashed var(--border);border-radius:var(--radius-sm);padding:10px;margin-top:6px}
.img-lbl{font-size:11px;color:var(--text-3);cursor:pointer;display:inline-flex;align-items:center;gap:5px;transition:color .12s}
.img-lbl:hover{color:var(--text-2)}
.img-grid{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.img-thumb{position:relative;width:56px;height:56px;border-radius:var(--radius-sm);overflow:hidden;border:1px solid var(--border)}
.img-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.img-rm{position:absolute;top:2px;right:2px;background:rgba(0,0,0,.6);color:#fff;border:none;border-radius:4px;font-size:10px;cursor:pointer;padding:1px 4px;line-height:1.5}
.modal-foot{display:flex;justify-content:space-between;align-items:center;margin-top:18px;padding-top:16px;border-top:1px solid var(--border-soft)}
.btn-danger{background:none;border:none;cursor:pointer;font-size:12px;color:#c0392b;font-family:'DM Sans',sans-serif;padding:0}
.btn-danger:hover{text-decoration:underline}
.btn-row{display:flex;gap:8px}
.btn{padding:8px 18px;border-radius:var(--radius-sm);font-size:13px;font-weight:500;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .12s;border:1px solid transparent}
.btn-ghost{background:transparent;border-color:var(--border);color:var(--text-2)}
.btn-ghost:hover{border-color:var(--text-3);color:var(--text)}
.btn-primary{background:var(--text);color:#fff;border-color:var(--text)}
.btn-primary:hover{opacity:.88}
.btn-primary:disabled{opacity:.4;cursor:not-allowed}

/* VIEW MODAL */
.view-modal{max-width:660px}
.view-header-meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:20px}
.view-status-pill{display:inline-flex;align-items:center;font-size:11px;font-weight:600;padding:3px 10px;border-radius:99px}
.view-meta-txt{font-size:11px;color:var(--text-3)}
.assume-bar{background:var(--c-producao-bg);border:1px solid rgba(24,95,165,.18);border-radius:var(--radius-sm);padding:12px 14px;display:flex;gap:8px;align-items:center;margin-bottom:18px}
.assume-bar p{font-size:12px;color:var(--c-producao-tx);font-weight:500;white-space:nowrap;margin-right:4px}
.assume-bar select{flex:1;padding:7px 10px;border:1px solid rgba(24,95,165,.25);border-radius:var(--radius-sm);background:var(--surface);color:var(--text);font-size:13px;font-family:'DM Sans',sans-serif;outline:none;min-width:0;cursor:pointer}
.assume-bar select:focus{border-color:var(--c-producao-ac)}
.btn-assume{padding:7px 16px;background:var(--c-producao-ac);color:#fff;border:none;border-radius:var(--radius-sm);font-size:13px;font-weight:500;cursor:pointer;font-family:'DM Sans',sans-serif;white-space:nowrap;transition:opacity .12s}
.btn-assume:hover{opacity:.88}
.view-body{max-height:55vh;overflow-y:auto;padding-right:2px}
.view-section{margin-bottom:22px}
.view-section:last-child{margin-bottom:0}
.view-section-title{font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3);margin-bottom:10px;display:flex;align-items:center;gap:8px}
.view-section-title::after{content:'';flex:1;height:1px;background:var(--border-soft)}
.view-text{font-size:13px;color:var(--text);line-height:1.75;white-space:pre-wrap;word-break:break-word}
.view-imgs{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.view-img{width:80px;height:80px;border-radius:var(--radius-sm);overflow:hidden;border:1px solid var(--border);cursor:zoom-in;flex-shrink:0;transition:border-color .12s}
.view-img:hover{border-color:var(--text-3)}
.view-img img{width:100%;height:100%;object-fit:cover;display:block}
.view-empty{text-align:center;padding:32px 0;color:var(--text-3);font-size:13px}

/* LIGHTBOX */
.lightbox{display:none;position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:300;align-items:center;justify-content:center;cursor:zoom-out}
.lightbox.open{display:flex}
.lightbox img{max-width:92vw;max-height:92vh;border-radius:var(--radius-sm);object-fit:contain;box-shadow:0 8px 40px rgba(0,0,0,.5)}
.lightbox-close{position:fixed;top:16px;right:20px;background:none;border:none;color:#fff;font-size:28px;cursor:pointer;line-height:1;opacity:.7;transition:opacity .12s}
.lightbox-close:hover{opacity:1}

/* PROD */
.prod-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.prod-top h2{font-size:15px;font-weight:600;letter-spacing:-.02em}
.year-nav{display:flex;align-items:center;gap:10px}
.year-nav button{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:5px 12px;cursor:pointer;font-size:13px;color:var(--text-2);transition:all .12s}
.year-nav button:hover{border-color:var(--text-3);color:var(--text)}
.year-nav span{font-size:15px;font-weight:600;min-width:44px;text-align:center}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:20px}
.metric{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px}
.metric-lbl{font-size:11px;font-weight:500;color:var(--text-3);text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px}
.metric-val{font-size:26px;font-weight:600;color:var(--text);letter-spacing:-.03em;line-height:1}
.metric-sub{font-size:11px;color:var(--text-3);margin-top:3px}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
thead th{font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--text-2);padding:10px 12px;text-align:left;background:var(--bg);border-bottom:1px solid var(--border)}
thead th:not(:first-child){text-align:center}
tbody td{padding:10px 12px;border-bottom:1px solid var(--border-soft);vertical-align:top}
tbody td:not(:first-child){text-align:center}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover td{background:#FAFAF8}
.tfoot-row td{padding:9px 12px;border-top:1px solid var(--border);font-weight:600;background:var(--bg);font-size:12px;color:var(--text-2)}
.tfoot-row td:not(:first-child){text-align:center}
.pill-id{display:inline-block;font-size:10px;font-family:'DM Mono',monospace;padding:2px 7px;border-radius:99px;background:#E8F0FA;color:#0C447C;margin:1px}
.empty{text-align:center;padding:56px 0;color:var(--text-3);font-size:13px;line-height:1.7}
.loading{text-align:center;padding:40px;color:var(--text-3);font-size:13px}
.pane-inner{padding:20px 24px}
</style>
</head>
<body>

<!-- TELA DE LOGIN (visível enquanto não autenticado) -->
<div class="login-screen" id="login-screen">
  <div class="login-card">
    <div class="login-logo">Casos <span>Clínicos</span></div>
    <p class="login-sub">Plataforma de gestão de casos clínicos AROS.<br>Faça login com sua conta Google para continuar.</p>
    <button class="btn-google" id="btn-google-login" onclick="signInWithGoogle()">
      <!-- Google G logo -->
      <svg width="18" height="18" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg">
        <path d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.874 2.684-6.615z" fill="#4285F4"/>
        <path d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332C2.438 15.983 5.482 18 9 18z" fill="#34A853"/>
        <path d="M3.964 10.71c-.18-.54-.282-1.117-.282-1.71s.102-1.17.282-1.71V4.958H.957C.347 6.173 0 7.548 0 9s.348 2.827.957 4.042l3.007-2.332z" fill="#FBBC05"/>
        <path d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0 5.482 0 2.438 2.017.957 4.958L3.964 6.29C4.672 4.163 6.656 3.58 9 3.58z" fill="#EA4335"/>
      </svg>
      Entrar com Google
    </button>
    <div class="login-error" id="login-error"></div>
  </div>
</div>

<nav>
  <div class="nav-brand">Casos <span>Clínicos</span></div>
  <button class="tab-btn active" onclick="switchTab('kanban',this)">Kanban</button>
  <button class="tab-btn" onclick="switchTab('producao',this)">Produção</button>
  <button class="btn-nav-new" onclick="openNew('remember')">+ Novo Caso</button>
  <div class="nav-right">
    <div class="nav-status">
      <div class="status-dot" id="status-dot"></div>
      <span id="status-txt">Conectando...</span>
    </div>
    <div class="nav-user" id="nav-user" style="display:none">
      <img class="nav-user-photo" id="nav-user-photo" src="" alt=""/>
      <span class="nav-user-name" id="nav-user-name"></span>
      <button class="nav-signout" onclick="doSignOut()">Sair</button>
    </div>
  </div>
</nav>

<!-- KANBAN -->
<div class="pane active" id="pane-kanban">
  <div id="quick-bar" class="quick-bar" style="display:none"></div>
  <div class="board-wrap">
    <div class="board" id="board">
      <div class="loading">Carregando casos...</div>
    </div>
  </div>
</div>

<!-- PRODUÇÃO -->
<div class="pane" id="pane-producao">
  <div class="pane-inner">
    <div class="prod-top">
      <h2>Produção por professor</h2>
      <div class="year-nav">

window.doSignOut = function() {
  if (dbUnsubscribe) { dbUnsubscribe(); dbUnsubscribe = null; }

};

onAuthStateChanged(auth, user => {
  const loginScreen = document.getElementById('login-screen');
  const navUser = document.getElementById('nav-user');
  const errEl = document.getElementById('login-error');
  const btn = document.getElementById('btn-google-login');

  if (user) {

    // Verifica se o e-mail está autorizado
    if (!AUTHORIZED_EMAILS.has(email)) {
      signOut(auth);
      errEl.textContent = `Acesso não autorizado (${user.email}). Fale com o administrador.`;
      errEl.classList.add('show');
      btn.disabled = false;
      btn.innerHTML = `<svg width="18" height="18" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg"><path d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.874 2.684-6.615z" fill="#4285F4"/><path d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332C2.438 15.983 5.482 18 9 18z" fill="#34A853"/><path d="M3.964 10.71c-.18-.54-.282-1.117-.282-1.71s.102-1.17.282-1.71V4.958H.957C.347 6.173 0 7.548 0 9s.348 2.827.957 4.042l3.007-2.332z" fill="#FBBC05"/><path d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0 5.482 0 2.438 2.017.957 4.958L3.964 6.29C4.672 4.163 6.656 3.58 9 3.58z" fill="#EA4335"/></svg> Entrar com Google`;
      return;
    }

    // Usuário autorizado — esconde login, mostra app
    loginScreen.classList.add('hidden');
    navUser.style.display = 'flex';
    document.getElementById('nav-user-photo').src = user.photoURL || '';
    document.getElementById('nav-user-name').textContent = user.displayName
      ? user.displayName.split(' ')[0] : user.email;

    // Conecta ao banco
    db = getDatabase(app);
    dbRef = ref(db, 'casos');
    setStatus(true, 'Conectado');

    dbUnsubscribe = onValue(dbRef, snap => {
      cards = snap.val() || {};
      render();
      renderQuickBar();
      renderProd();
      if (viewingId && document.getElementById('view-overlay').classList.contains('open')) {
        openView(viewingId);
      }
    }, err => {
      setStatus(false, 'Erro de conexão');
      console.error(err);
    });

  } else {
    // Não autenticado — mostra login, esconde user info
    loginScreen.classList.remove('hidden');
    navUser.style.display = 'none';
    cards = {};
    if (dbUnsubscribe) { dbUnsubscribe(); dbUnsubscribe = null; }
    setStatus(false, 'Desconectado');
  }
});

function getAvatar(name, extra) {

  return `<span class="prof-avatar${extra ? ' '+extra : ''}" style="background:${bg}">${init}</span>`;

// QUICK BAR
function renderQuickBar() {
  const bar = document.getElementById('quick-bar');
  const arr = Object.values(cards);
  const available = arr.filter(c => c.col === 'remember');
  const inProd    = arr.filter(c => c.col === 'producao');

  const availHTML = available.length
    ? available.map(c =>
        `<button class="qb-chip" onclick="openView('${c._uid}')">${esc(c.tema || c.id || '(sem tema)')}</button>`
      ).join('')
    : '<span class="qb-empty">Nenhum caso disponível</span>';

  const inProdHTML = inProd.length
    ? inProd.map(c => `
        <button class="qb-inprod-card" onclick="openView('${c._uid}')">
          ${getAvatar(c.prof || '', 'prof-avatar-sm')}
          <div class="qb-inprod-info">
            <span class="qb-inprod-prof">${esc(c.prof || 'Sem professor')}</span>
            <span class="qb-inprod-tema">${esc(c.tema || c.id || '(sem tema)')}</span>
          </div>
        </button>`).join('')
    : '<span class="qb-empty">Nenhum caso em produção</span>';

  bar.innerHTML = `
    <div class="qb-section">
      <div class="qb-section-head">

        <span class="qb-count">${available.length}</span>
      </div>

    <div class="qb-section">
      <div class="qb-section-head">
        <span class="qb-dot qb-dot-inprod"></span>
        Em produção
        <span class="qb-count">${inProd.length}</span>
      </div>
      <div class="qb-scroll">${inProdHTML}</div>
    </div>`;
  bar.style.display = 'flex';
}

// RENDER KANBAN
function render(){
  const board = document.getElementById('board');
  board.innerHTML = '';
  const cardArr = Object.values(cards);

  const sel = document.getElementById('f-col');
  sel.innerHTML = '';
  COLS.forEach(c=>{const o=document.createElement('option');o.value=c.id;o.textContent=c.label;sel.appendChild(o);});

  COLS.forEach(col => {
    const cc = cardArr.filter(c=>c.col===col.id);
    const colEl = document.createElement('div');
    colEl.className = 'column';

    const hdr = document.createElement('div');
    hdr.className = 'col-header';
    hdr.style.cssText = `background:${col.hd}`;
    hdr.innerHTML = `<span>${col.label}</span><span class="col-count">${cc.length}</span>`;
    colEl.appendChild(hdr);

    const body = document.createElement('div');
    body.className = 'col-body';
    body.dataset.col = col.id;
    body.addEventListener('dragover', e=>{e.preventDefault();body.classList.add('drag-over')});
    body.addEventListener('dragleave', ()=>body.classList.remove('drag-over'));
    body.addEventListener('drop', e=>{
      e.preventDefault(); body.classList.remove('drag-over');
      if(dragging){
        const card = cards[dragging];
        if(card){
          const updates = {col: col.id};
          if(col.id==='peer' && card.col!=='peer' && !card.peerDate) updates.peerDate = new Date().toISOString();
          update(ref(db,'casos/'+dragging), updates);
        }
      }
    });

    cc.forEach(card => {
      const el = document.createElement('div');
      el.className = 'card';
      el.draggable = true;
      const isRemember = card.col === 'remember';
      const tipoKey = card.tipo ? card.tipo.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\s+/g,'-') : '';

      el.innerHTML = `
        <div class="card-top">
          <span class="card-title">${esc(card.tema || card.id || '(sem título)')}</span>
          <div class="card-actions">
            <button class="card-edit" title="Editar" data-uid="${card._uid}">
              <svg width="12" height="12" viewBox="0 0 16 16" fill="none"><path d="M11 2l3 3-9 9H2v-3L11 2z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
            </button>
          </div>
        </div>
        ${card.id && card.id !== card.tema ? `<div class="card-id-mono">${esc(card.id)}</div>` : ''}
        <div class="card-footer">
          ${card.tipo ? `<span class="card-tipo tipo-${tipoKey}">${esc(card.tipo)}</span>` : '<span></span>'}
          ${card.prof
            ? getAvatar(card.prof)
            : (isRemember ? '<span class="card-claim-hint">Assumir →</span>' : '<span></span>')}
        </div>`;

      el.addEventListener('dragstart', ()=>{dragging=card._uid;el.classList.add('dragging')});
      el.addEventListener('dragend', ()=>{dragging=null;el.classList.remove('dragging')});
      el.addEventListener('click', e => {
        if (e.target.closest('.card-edit')) return;
        openView(card._uid);
      });
      el.querySelector('.card-edit').addEventListener('click', e => {
        e.stopPropagation();
        openEdit(card._uid);
      });

      body.appendChild(el);
    });

    const addBtn = document.createElement('button');
    addBtn.className = 'add-btn';
    addBtn.textContent = '+ Novo caso';
    addBtn.onclick = ()=>openNew(col.id);
    body.appendChild(addBtn);

    colEl.appendChild(body);
    board.appendChild(colEl);
  });
}

function buildViewImgs(imgs) {
  if (!imgs || !imgs.length) return '';
  return `<div class="view-imgs">${imgs.map(src=>`<div class="view-img"><img src="${src}" loading="lazy"/></div>`).join('')}</div>`;
}

window.openView = function(uid) {
  const card = cards[uid];
  if (!card) return;
  viewingId = uid;
  const col = COLS.find(c => c.id === card.col) || COLS[0];

  document.getElementById('view-case-id').textContent = (card.id && card.id !== card.tema) ? card.id : '';
  document.getElementById('view-title').textContent = card.tema || card.id || '(sem título)';

  const dateCriado = card.createdAt ? new Date(card.createdAt).toLocaleDateString('pt-BR') : '';
  const datePeer   = card.peerDate  ? new Date(card.peerDate).toLocaleDateString('pt-BR')  : '';
  let metaParts = [];
  if (card.prof) metaParts.push(`${getAvatar(card.prof)} ${esc(card.prof)}`);
  if (card.tipo) metaParts.push(`📋 ${esc(card.tipo)}`);
  if (card.ano)  metaParts.push(`📅 ${esc(card.ano)}`);
  if (dateCriado) metaParts.push(`Criado em ${dateCriado}`);
  if (datePeer)   metaParts.push(`Peer-review em ${datePeer}`);
  document.getElementById('view-header-meta').innerHTML = `
    <span class="view-status-pill" style="background:${col.bg};color:${col.tx}">${col.label}</span>
    ${metaParts.length ? `<span class="view-meta-txt" style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">${metaParts.join('<span style="color:var(--border)">·</span>')}</span>` : ''}`;

  const assumeBar = document.getElementById('view-assume-bar');
  assumeBar.style.display = card.col === 'remember' ? 'flex' : 'none';
  if (card.col === 'remember') document.getElementById('view-assume-name').value = '';

  document.getElementById('view-btn-release').style.display =
    (card.col === 'producao' && card.prof) ? 'block' : 'none';

  const body = document.getElementById('view-body');
  let html = '';
  if (card.enunciado) html += `<div class="view-section"><div class="view-section-title">Enunciado</div><div class="view-text">${esc(card.enunciado)}</div>${buildViewImgs(card.imgs?.enunciado)}</div>`;
  ['p1','p2','p3'].forEach((k,i) => {
    if (card[k]) html += `<div class="view-section"><div class="view-section-title">Pergunta ${i+1}</div><div class="view-text">${esc(card[k])}</div>${buildViewImgs(card.imgs?.[k])}</div>`;
  });
  if (card.obs) html += `<div class="view-section"><div class="view-section-title">Observações</div><div class="view-text">${esc(card.obs)}</div></div>`;
  if (!html) html = '<div class="view-empty">Nenhum conteúdo preenchido ainda.</div>';
  body.innerHTML = html;

  body.querySelectorAll('.view-img').forEach(thumb => {
    thumb.onclick = () => openLightbox(thumb.querySelector('img').src);
  });

  document.getElementById('view-overlay').classList.add('open');
  if (card.col === 'remember') setTimeout(() => document.getElementById('view-assume-name').focus(), 60);
};

window.closeView = function() { document.getElementById('view-overlay').classList.remove('open'); };
window.openEditFromView = function() { closeView(); openEdit(viewingId); };

window.assumeCard = function() {
  const name = document.getElementById('view-assume-name').value.trim();
  if (!name) { document.getElementById('view-assume-name').focus(); return; }
  if (!viewingId) return;
  update(ref(db, 'casos/' + viewingId), { prof: name, col: 'producao' }).then(() => closeView());
};

window.releaseCard = function() {
  if (!viewingId) return;
  const card = cards[viewingId];
  if (!card) return;
  if (!confirm(`Remover "${card.prof}" deste caso? O caso voltará para o quadro Remember.`)) return;
  update(ref(db, 'casos/' + viewingId), { prof: '', col: 'remember' }).then(() => closeView());
};

// O modal de visualização fecha apenas pelo botão X

// LIGHTBOX
window.openLightbox = function(src) {
  document.getElementById('lightbox-img').src = src;
  document.getElementById('lightbox').classList.add('open');
};
window.closeLightbox = function() { document.getElementById('lightbox').classList.remove('open'); };
document.getElementById('lightbox').addEventListener('click', e => {
  if (!e.target.closest('.lightbox-close')) closeLightbox();
});

// RENDER PRODUÇÃO
function renderProd(){
  document.getElementById('year-lbl').textContent = prodYear;
  const arr = Object.values(cards);
  const produced = arr.filter(c=>c.peerDate);
  const thisYear = produced.filter(c=>new Date(c.peerDate).getFullYear()===prodYear);
  const allProfs = [...new Set(produced.map(c=>c.prof).filter(Boolean))].sort();
  const profsYear = [...new Set(thisYear.map(c=>c.prof).filter(Boolean))];
  let topProf='—', topN=0;
  profsYear.forEach(p=>{const n=thisYear.filter(c=>c.prof===p).length;if(n>topN){topN=n;topProf=p;}});

  document.getElementById('metrics').innerHTML = `
    <div class="metric"><div class="metric-lbl">Produzidos em ${prodYear}</div><div class="metric-val">${thisYear.length}</div></div>
    <div class="metric"><div class="metric-lbl">Professores ativos</div><div class="metric-val">${profsYear.length}</div></div>
    <div class="metric"><div class="metric-lbl">Maior produção</div><div class="metric-val">${topN||'—'}</div><div class="metric-sub">${esc(topProf)}</div></div>
    <div class="metric"><div class="metric-lbl">Total acumulado</div><div class="metric-val">${produced.length}</div></div>`;

  const cont = document.getElementById('prod-table');
  if(!allProfs.length){cont.innerHTML='<div class="empty">Nenhum caso atingiu Peer-review ainda.<br>Mova um caso para a coluna <strong>Peer-review</strong> para registrar a produção.</div>';return;}

  const activeIdx = MONTHS.map((_,i)=>i).filter(i=>thisYear.some(c=>new Date(c.peerDate).getMonth()===i));
  const showIdx = activeIdx.length ? activeIdx : MONTHS.map((_,i)=>i);

  let html = `<table><thead><tr><th>Professor</th>`;
  showIdx.forEach(i=>{html+=`<th>${MONTHS[i]}</th>`;});
  html += `<th>Total ${prodYear}</th></tr></thead><tbody>`;
  allProfs.forEach(p=>{
    const rowTotal = thisYear.filter(c=>c.prof===p).length;
    html += `<tr><td style="font-weight:500">${esc(p)}</td>`;
    showIdx.forEach(i=>{
      const mc = thisYear.filter(c=>c.prof===p&&new Date(c.peerDate).getMonth()===i);
      html += `<td>${mc.length?`<div style="font-weight:600;margin-bottom:3px">${mc.length}</div><div>${mc.map(c=>`<span class="pill-id">${esc(c.id||c.tema||'—')}</span>`).join('')}</div>`:'<span style="color:var(--text-3)">—</span>'}</td>`;
    });
    html += `<td style="font-weight:600;color:var(--c-producao-tx)">${rowTotal||'—'}</td></tr>`;
  });
  html += `<tr class="tfoot-row"><td>Total</td>`;
  showIdx.forEach(i=>{const n=thisYear.filter(c=>new Date(c.peerDate).getMonth()===i).length;html+=`<td>${n||'—'}</td>`;});
  html += `<td>${thisYear.length||'—'}</td></tr></tbody></table>`;
  cont.innerHTML = html;
}

// EDIT MODAL
function clearImgs(){
  tmpImgs={enunciado:[],p1:[],p2:[],p3:[]};
  ['enunciado','p1','p2','p3'].forEach(k=>{const g=document.getElementById('imgs-'+k);if(g)g.innerHTML='';});
}
window.handleImgs = function(e, field){
  [...e.target.files].forEach(f=>{
    const r=new FileReader();
    r.onload=ev=>{tmpImgs[field].push(ev.target.result);renderThumb(field,tmpImgs[field].length-1,ev.target.result);};
    r.readAsDataURL(f);
  });
  e.target.value='';
};
function renderThumb(field,idx,src){
  const g=document.getElementById('imgs-'+field);
  const w=document.createElement('div');w.className='img-thumb';
  w.innerHTML=`<img src="${src}"><button class="img-rm" onclick="delImg('${field}',${idx})">×</button>`;
  g.appendChild(w);
}
window.delImg = function(field,idx){
  tmpImgs[field].splice(idx,1);
  const g=document.getElementById('imgs-'+field);g.innerHTML='';
  tmpImgs[field].forEach((s,i)=>renderThumb(field,i,s));
};

window.openNew = function(colId){
  editingId=null;clearImgs();
  ['tipo','tema','ano','id','enunciado','p1','p2','p3','obs'].forEach(k=>{const el=document.getElementById('f-'+k);if(el)el.value='';});
  document.getElementById('f-col').value=colId;
  document.getElementById('modal-title').textContent='Novo caso';
  document.getElementById('btn-delete').style.display='none';
  document.getElementById('overlay').classList.add('open');
  setTimeout(()=>document.getElementById('f-tema').focus(),60);
};

window.openEdit = function(uid){
  const card=cards[uid]; if(!card)return;
  editingId=uid; clearImgs();
  ['enunciado','p1','p2','p3'].forEach(k=>{tmpImgs[k]=[...(card.imgs&&card.imgs[k]?card.imgs[k]:[])];tmpImgs[k].forEach((s,i)=>renderThumb(k,i,s));});
  document.getElementById('f-tipo').value=card.tipo||'';
  document.getElementById('f-tema').value=card.tema||'';
  document.getElementById('f-ano').value=card.ano||'';
  document.getElementById('f-id').value=card.id||'';
  document.getElementById('f-enunciado').value=card.enunciado||'';
  document.getElementById('f-p1').value=card.p1||'';
  document.getElementById('f-p2').value=card.p2||'';
  document.getElementById('f-p3').value=card.p3||'';
  document.getElementById('f-obs').value=card.obs||'';
  document.getElementById('f-col').value=card.col;
  document.getElementById('modal-title').textContent='Editar caso';
  document.getElementById('btn-delete').style.display='block';
  document.getElementById('overlay').classList.add('open');
};

window.closeModal = function(){document.getElementById('overlay').classList.remove('open');};

window.saveCard = function(){
  const btn=document.getElementById('btn-save');
  btn.disabled=true;
  const uid = editingId || ('c'+Date.now()+Math.random().toString(36).slice(2,6));
  const existing = editingId ? cards[editingId] : null;
  const newCol = document.getElementById('f-col').value;
  const newCard = {
    _uid:uid, col:newCol,
    prof: existing ? (existing.prof || '') : '',
    tipo:document.getElementById('f-tipo').value.trim(),
    tema:document.getElementById('f-tema').value.trim(),
    ano:document.getElementById('f-ano').value.trim(),
    id:document.getElementById('f-id').value.trim(),
    enunciado:document.getElementById('f-enunciado').value.trim(),
    p1:document.getElementById('f-p1').value.trim(),
    p2:document.getElementById('f-p2').value.trim(),
    p3:document.getElementById('f-p3').value.trim(),
    obs:document.getElementById('f-obs').value.trim(),
    imgs:{enunciado:[...tmpImgs.enunciado],p1:[...tmpImgs.p1],p2:[...tmpImgs.p2],p3:[...tmpImgs.p3]},
    peerDate: existing ? (existing.peerDate||null) : null,
    createdAt: existing ? (existing.createdAt||new Date().toISOString()) : new Date().toISOString(),
  };
  if(newCol==='peer' && (!existing||existing.col!=='peer') && !newCard.peerDate){
    newCard.peerDate=new Date().toISOString();
  }
  const op = editingId
    ? update(ref(db,'casos/'+uid), newCard)
    : set(ref(db,'casos/'+uid), newCard);
  op.then(()=>{closeModal();btn.disabled=false;})
    .catch(e=>{alert('Erro ao salvar: '+e.message);btn.disabled=false;});
};

window.deleteCard = function(){
  if(!editingId)return;
  if(!confirm('Excluir este caso?'))return;
  remove(ref(db,'casos/'+editingId)).then(()=>closeModal());
};

document.getElementById('overlay').addEventListener('click',e=>{if(e.target===document.getElementById('overlay'))closeModal();});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();closeView();closeLightbox();}});
</script>
